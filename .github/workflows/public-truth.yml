name: Public Truth Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install YAML test dependency
        run: python -m pip install --upgrade pyyaml

      - name: Compile Python
        run: python -m compileall -q phase1 tests

      - name: Run repository proof
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify current public privacy and evidence boundary
        run: |
          grep -q 'LOCAL_HEALTH_SNAPSHOT_NOT_DEPLOYMENT_TELEMETRY' README.md
          grep -q 'LOCAL_HEALTH_SNAPSHOT_NOT_DEPLOYMENT_TELEMETRY' phase1/health_check_framework.py
          ! git grep -n '1FDV' -- README.md PHASE1_FOUNDATION_README.md phase1 tests
          ! git grep -n 'legal_automation' -- README.md PHASE1_FOUNDATION_README.md phase1 tests
          ! git grep -n 'evidence_manager' -- README.md PHASE1_FOUNDATION_README.md phase1 tests
